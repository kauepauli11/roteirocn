<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0e7c86">
<title>Meu roteiro de viagem</title>
<style>
:root{--bg:#eaf0f1;--surface:#fbfdfd;--ink:#13263a;--muted:#5c6f80;--line:#cfdadd;--accent:#0e7c86;--accent-ink:#fff;--warn:#b4432f;--soft:#dcebee;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--surface:#162532;--ink:#e6eef2;--muted:#93a6b4;--line:#27394a;--accent:#3cc1cc;--accent-ink:#06222a;--warn:#ef8a74;--soft:#1d3342}}
:root[data-theme="dark"]{--bg:#0e1a24;--surface:#162532;--ink:#e6eef2;--muted:#93a6b4;--line:#27394a;--accent:#3cc1cc;--accent-ink:#06222a;--warn:#ef8a74;--soft:#1d3342}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:500}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px;font-size:14px}
button.ghost:hover{color:var(--accent)}button.ghost.del:hover{color:var(--warn)}
.title{font:700 clamp(28px,7vw,42px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;border:0;background:none;padding:4px 0;border-bottom:2px solid var(--line);border-radius:0}
.title:focus{border-color:var(--accent);outline:none}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.meta label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px;flex:1 1 130px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0;font-size:14px;color:var(--muted)}
.stats b{display:block;font:700 24px/1.1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:8px 8px 0 0;background:none;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:16px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.head h2{font-size:21px}.head small{color:var(--muted);font-size:14px;margin-left:8px;font-family:"Instrument Sans",system-ui,sans-serif;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:13px}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.row:first-of-type{border-top:0}
.time{font-weight:600;font-variant-numeric:tabular-nums}
.what{display:flex;flex-direction:column;gap:1px}.what small{color:var(--muted)}
.what.done strong{text-decoration:line-through;color:var(--muted)}
.right{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.cost{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;margin-right:6px}
.empty{color:var(--muted);margin:8px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}.sum:first-of-type{border:0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(94vw,520px);padding:18px}
dialog::backdrop{background:rgba(10,20,30,.5)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fields label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
.fields .w{grid-column:1/-1}textarea{min-height:76px;resize:vertical}
.lk{color:var(--accent);font-size:14px;margin-right:10px}#tx{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border:0;border-radius:0;background:#fff;color:#000;text-align:center;padding:24px}#tx::backdrop{background:#fff}.cn1{font-size:min(13vw,18vh);font-weight:700;line-height:1.2}.cn2{font-size:min(8vw,10vh);margin-top:3vh;line-height:1.3}.cn3{font-size:min(5vw,6vh);margin-top:3vh}.cn4{font-size:min(4vw,5vh);margin-top:2vh;color:#555}
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}.clock{display:flex;flex-direction:column;gap:2px}.clock small{color:var(--muted)}.big{font:700 40px/1.1 "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums}
@media (max-width:480px){.fields{grid-template-columns:1fr}.row{grid-template-columns:48px 1fr}.right{grid-column:2}}
</style>
</head>
<body>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="bar"><button id="backup">Backup dos dados</button></div>

<dialog id="dlg">
  <form id="f"><h2 id="dt" style="font-size:20px"></h2><div class="fields" id="ff"></div>
  <div class="bar" style="margin:0"><button class="primary" type="submit">Salvar</button><button type="button" id="cancel">Cancelar</button></div></form>
